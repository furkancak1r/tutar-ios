name: Tutar
options:
  bundleIdPrefix: com.furkancakir
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - tr
    - Base
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9LYL5R6LS4
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: "1.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    EXTRACT_APP_INTENTS_METADATA: NO
    ENABLE_APP_INTENTS_METADATA_EXTRACTION: NO
targets:
  Tutar:
    type: application
    platform: iOS
    sources:
      - path: app/Tutar
        excludes:
          - Info.plist
          - Tutar.entitlements
      - path: app/Shared/Localizations
    info:
      path: app/Tutar/Info.plist
      properties:
        CFBundleDisplayName: Tutar
        CFBundleName: Tutar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Furkan Çakır. Dime upstream © Rafael Soh and contributors.
        NSFaceIDUsageDescription: Tutar uses device authentication only to protect the financial data stored on this device.
        CFBundleLocalizations:
          - en
          - tr
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.furkancakir.tutar
            CFBundleURLSchemes:
              - tutar
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: app/Tutar/Tutar.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.com.furkancakir.tutar
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.furkancakir.tutar
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: TutarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkancakir.tutar
        PRODUCT_NAME: Tutar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ponytail: preserve the immutable upstream v1 migration hash while hiding only its known relationship diagnostics.
        MOMC_NO_INVERSE_RELATIONSHIP_WARNINGS: YES
        MOMC_NO_DELETE_RULE_WARNINGS: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: Tutar Development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tutar App Store
  TutarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: app/TutarWidget
        excludes:
          - Info.plist
          - TutarWidget.entitlements
      - path: app/Tutar/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: app/Shared/Localizations
    info:
      path: app/TutarWidget/Info.plist
      properties:
        CFBundleDisplayName: Tutar Widget
        CFBundleName: TutarWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Furkan Çakır. Dime upstream © Rafael Soh and contributors.
        CFBundleLocalizations:
          - en
          - tr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: app/TutarWidget/TutarWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.furkancakir.tutar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkancakir.tutar.widget
        PRODUCT_NAME: TutarWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: Tutar Widget Development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tutar Widget App Store
  TutarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: app/TutarTests
    dependencies:
      - target: Tutar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkancakir.tutar.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tutar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tutar"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TutarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: app/TutarUITests
    dependencies:
      - target: Tutar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkancakir.tutar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tutar
        EXTRACT_APP_INTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_EXTRACTION: NO
schemes:
  Tutar:
    build:
      targets:
        Tutar: all
        TutarWidget: all
        TutarTests: [test]
        TutarUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: TutarTests
        - name: TutarUITests
    run:
      config: Debug
    archive:
      config: Release
